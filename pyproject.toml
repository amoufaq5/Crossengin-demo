[project]
name = "crossengin-demo"
version = "0.0.1"
description = "A privacy-first multimodal AI companion. See docs/adr/."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Crossengin Demo authors" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 1 - Planning",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "torch>=2.3,<3.0",            # BSD-3-Clause
    "transformers>=4.45,<5.0",    # Apache-2.0
    "numpy>=2.0,<3.0",            # BSD-3-Clause
    "sentencepiece>=0.2,<1.0",    # Apache-2.0 (SigLIP tokenizer)
    "protobuf>=5.0,<7.0",         # BSD-3-Clause (SigLIP tokenizer needs it)
    "safetensors>=0.4,<1.0",      # Apache-2.0
    "huggingface-hub>=0.25,<1.0", # Apache-2.0
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",       # Apache-2.0
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossengin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
files = ["src", "tests"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring model download (deselect with '-m \"not integration\"')",
]
