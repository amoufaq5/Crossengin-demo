name: build + smoke + unit tests

on:
  push:
    branches: [main, master, claude/zealous-keller-NTz2n]
  pull_request:

# Two jobs:
#   build-and-smoke  builds every module + example binary, then runs the
#                    10-query fever + /good demo and checks four counters.
#                    Those counters are a regression pin for that code path
#                    (reply-cache hits and per-query counters), NOT evidence
#                    of learning -- see docs/HOW_IT_LEARNS.md.
#                    It then runs the file-hardening and SecAgg (Scenario U,
#                    strict: SKIP counts as FAIL) integration scenarios.
#   unit-tests       runs all tests/unit/*.nova in parallel and fails on any
#                    failure not listed in tests/unit/known_failures.txt
#                    (scripts/test_ci.sh). Audit F-06.
#
# NOVA is pinned so builds are reproducible. Bump NOVA_REF deliberately
# (and re-run the suite) when picking up a NOVA change.
env:
  NOVA_REF: 858be313f273d71bc53e165b30c967f20507433e
  # The smoke step removes /tmp/crossengin.dlog; keep the historical paths.
  CE_RUN_DIR: /tmp

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CrossEngin
        uses: actions/checkout@v4
        with:
          path: Crossengin-demo

      # NOVA lives in a sibling repo. CrossEngin's Makefile drives it
      # via NOVA_ROOT; the common layout mirrors the dev setup
      # ($HOME/NOVA alongside $HOME/Crossengin-demo).
      - name: Checkout NOVA
        uses: actions/checkout@v4
        with:
          repository: amoufaq5/NOVA
          ref: ${{ env.NOVA_REF }}
          path: NOVA

      - name: Build NOVA bootstrap
        working-directory: NOVA
        run: |
          # NOVA ships its own bootstrap; whatever `make` produces at the
          # top level should include the launcher that CrossEngin's
          # Makefile looks for at $NOVA_ROOT/nova.
          if [ -f Makefile ]; then
            make
          else
            echo "NOVA has no top-level Makefile -- adjust this step when upstream layout changes."
            exit 1
          fi

      - name: Build CrossEngin (make install)
        working-directory: Crossengin-demo
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: |
          make install 2>&1 | tail -40
          echo "---"
          ls -la bin/

      - name: 10-query fever smoke (output counters)
        working-directory: Crossengin-demo
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: |
          rm -f /tmp/crossengin.dlog
          # 10x fever + /good, then /__learning__, then /quit.
          (
            for i in $(seq 1 10); do echo "fever"; echo "/good"; done
            echo "/__learning__"
            echo "/quit"
          ) | ./bin/crossengin-chat 2>&1 | tr -d '\r' > /tmp/smoke.out

          echo "--- smoke output (filtered) ---"
          grep -E '^(mc_|ff_|synapse_|ia_|dlog_|tick=)' /tmp/smoke.out || true

      - name: Assert Phase 0 counters unchanged (regression check, not a learning measure)
        working-directory: Crossengin-demo
        run: |
          # The invariant numbers are documented in docs/END_TO_END.md.
          # On a clean session (no packs), the 10-query demo produces
          # these exact counters:
          set -e
          grep -qE '^mc_hits=9$'               /tmp/smoke.out || { echo "FAIL: mc_hits != 9"; exit 1; }
          grep -qE '^mc_misses=1$'             /tmp/smoke.out || { echo "FAIL: mc_misses != 1"; exit 1; }
          grep -qE '^ff_goodness=486000$'      /tmp/smoke.out || { echo "FAIL: ff_goodness != 486000"; exit 1; }
          grep -qE '^synapse_mean_weight=300$' /tmp/smoke.out || { echo "FAIL: synapse_mean_weight != 300"; exit 1; }
          grep -qE '^ia_proto_strength_unknown=10$' /tmp/smoke.out || { echo "FAIL: ia_proto_strength_unknown != 10"; exit 1; }
          echo "OK: all Phase 0 pt1-pt4 invariants hold."

      # B3 (audit F-03): with CE_HEBB=1 the router table learns from use
      # alone. 10x fever, no /good, cache ablated so every turn routes.
      # Control: the same run without CE_HEBB leaves every weight at 0.
      - name: CE_HEBB smoke (router table learns without /good)
        working-directory: Crossengin-demo
        run: |
          set -e
          # Each run gets a fresh private HOME / run dir (no dlog, history
          # or snapshot carried over from earlier steps).
          hebb_run() {
            local d; d=$(mktemp -d); chmod 700 "$d"
            ( for i in $(seq 1 10); do echo "fever"; done
              echo "/__learning__"; echo "/synapse fever"; echo "/quit" ) \
              | env HOME="$d" CE_RUN_DIR="$d" "$@" ./bin/crossengin-chat 2>&1 | tr -d '\r'
            rm -rf "$d"
          }
          CTRL=$(hebb_run CE_ABL_CACHE=1)
          HEBB=$(hebb_run CE_ABL_CACHE=1 CE_HEBB=1)
          echo "--- control ---"; grep -E '^(synapse_|hebb_)' <<<"$CTRL" || true
          echo "--- CE_HEBB=1 ---"; grep -E '^(synapse_|hebb_)' <<<"$HEBB" || true
          c=$(grep -oE '^synapse_mean_weight=[0-9]+' <<<"$CTRL" | cut -d= -f2)
          h=$(grep -oE '^synapse_mean_weight=[0-9]+' <<<"$HEBB" | cut -d= -f2)
          grep -qE '^hebb_steps=10$' <<<"$HEBB"  || { echo "FAIL: hebb_steps != 10"; exit 1; }
          grep -qE '^hebb_updates=[1-9][0-9]*$' <<<"$HEBB" || { echo "FAIL: no Hebbian updates"; exit 1; }
          [ "$c" = "0" ] || { echo "FAIL: control mean weight $c != 0"; exit 1; }
          [ "$h" -gt "$c" ] || { echo "FAIL: CE_HEBB mean weight $h not above control $c"; exit 1; }
          if grep -q '^hebb_' <<<"$CTRL"; then echo "FAIL: hebb rows without CE_HEBB"; exit 1; fi
          # The last leg of the 3-hop chain (fever -> headache) learns too.
          grep -qE 'headache .*weight=[1-9]' <<<"$HEBB" || { echo "FAIL: last chain leg did not learn"; exit 1; }
          grep -qE 'headache .*weight=0$' <<<"$CTRL" || { echo "FAIL: control last leg not 0"; exit 1; }
          echo "OK: router table learned from use alone (mean weight $c -> $h)."

      # Audit F-24: private runtime dir (0700, refused when shared or a
      # symlink), 0600 no-follow snapshots, daemon command input location.
      - name: File-hardening scenario
        working-directory: Crossengin-demo
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: bash tests/integration/scenario_file_hardening.sh

      # B1 (audit C12): the cognitive router's synapse table is separate from
      # the reasoning part's pool graph; snapshot "router" entry, legacy
      # migration, per-session tables.
      - name: Router-table scenario
        working-directory: Crossengin-demo
        timeout-minutes: 5
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: bash tests/integration/scenario_router_table.sh

      # B2: E1 ablation switches (CE_ABL_*) and the CE_EXP_TRACE line; all off
      # by default, each switch shown to take effect.
      - name: Experiment-flags scenario
        working-directory: Crossengin-demo
        timeout-minutes: 5
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: bash tests/integration/scenario_exp_flags.sh

      # B4: E1 ablation harness (experiments/e1). Selftest, input lint and a
      # full-arm smoke with the determinism gate; the study runs offline.
      - name: E1 harness scenario
        working-directory: Crossengin-demo
        timeout-minutes: 5
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: bash tests/integration/scenario_e1_harness.sh

      # B6: E2 conflicting-sources harness (experiments/e2). Selftest, driver
      # build and a development-dataset smoke with the metric cross-check;
      # the study runs offline.
      - name: E2 harness scenario
        working-directory: Crossengin-demo
        timeout-minutes: 5
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
          CE_IT_STRICT: "1"
        run: bash tests/integration/scenario_e2_harness.sh

      # SecAgg protocol v3n-sa (A1): token-free wire, session nonces,
      # persisted round counter, abort-on-dropout, weak-DH gate. Each stage
      # uses its own mktemp CE_RUN_DIR. CE_IT_STRICT=1 turns any environment
      # SKIP (bind denied, python3 missing) into a FAIL.
      - name: SecAgg scenario U
        working-directory: Crossengin-demo
        timeout-minutes: 10
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
          CE_IT_STRICT: "1"
        run: bash tests/integration/scenario_u_secagg.sh

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CrossEngin
        uses: actions/checkout@v4
        with:
          path: Crossengin-demo

      - name: Checkout NOVA (pinned)
        uses: actions/checkout@v4
        with:
          repository: amoufaq5/NOVA
          ref: ${{ env.NOVA_REF }}
          path: NOVA

      - name: Build NOVA
        working-directory: NOVA
        run: make

      - name: Unit tests against known failures
        working-directory: Crossengin-demo
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: bash scripts/test_ci.sh
