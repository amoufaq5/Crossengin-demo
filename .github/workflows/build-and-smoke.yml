name: build + 10-query fever smoke

on:
  push:
    branches: [main, master]
  pull_request:

# Catches Phase 0 regressions on every PR: builds all 395+ NOVA modules
# plus the 9 example binaries, then runs the canonical 10-query fever +
# /good demo and asserts the pt1-pt4 invariant numbers. If any phase
# accidentally kills the synapse-weighted retrieval, moment-cache LRU,
# Forward-Forward layer, or adaptive-intent prototypes, this workflow
# fails.

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CrossEngin
        uses: actions/checkout@v4
        with:
          path: Crossengin-demo

      # NOVA lives in a sibling repo. CrossEngin's Makefile drives it
      # via NOVA_ROOT; the common layout mirrors the dev setup
      # ($HOME/NOVA alongside $HOME/Crossengin-demo).
      - name: Checkout NOVA
        uses: actions/checkout@v4
        with:
          repository: amoufaq5/NOVA
          path: NOVA

      - name: Build NOVA bootstrap
        working-directory: NOVA
        run: |
          # NOVA ships its own bootstrap; whatever `make` produces at the
          # top level should include the launcher that CrossEngin's
          # Makefile looks for at $NOVA_ROOT/nova.
          if [ -f Makefile ]; then
            make
          else
            echo "NOVA has no top-level Makefile -- adjust this step when upstream layout changes."
            exit 1
          fi

      - name: Build CrossEngin (make install)
        working-directory: Crossengin-demo
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: |
          make install 2>&1 | tail -40
          echo "---"
          ls -la bin/

      - name: 10-query fever smoke
        working-directory: Crossengin-demo
        env:
          NOVA_ROOT: ${{ github.workspace }}/NOVA
        run: |
          rm -f /tmp/crossengin.dlog
          # 10x fever + /good, then /__learning__, then /quit.
          (
            for i in $(seq 1 10); do echo "fever"; echo "/good"; done
            echo "/__learning__"
            echo "/quit"
          ) | ./bin/crossengin-chat 2>&1 | tr -d '\r' > /tmp/smoke.out

          echo "--- smoke output (filtered) ---"
          grep -E '^(mc_|ff_|synapse_|ia_|dlog_|tick=)' /tmp/smoke.out || true

      - name: Assert Phase 0 regression invariants
        working-directory: Crossengin-demo
        run: |
          # The invariant numbers are documented in docs/END_TO_END.md.
          # On a clean session (no packs), the 10-query demo produces
          # these exact counters:
          set -e
          grep -qE '^mc_hits=9$'               /tmp/smoke.out || { echo "FAIL: mc_hits != 9"; exit 1; }
          grep -qE '^mc_misses=1$'             /tmp/smoke.out || { echo "FAIL: mc_misses != 1"; exit 1; }
          grep -qE '^ff_goodness=486000$'      /tmp/smoke.out || { echo "FAIL: ff_goodness != 486000"; exit 1; }
          grep -qE '^synapse_mean_weight=300$' /tmp/smoke.out || { echo "FAIL: synapse_mean_weight != 300"; exit 1; }
          grep -qE '^ia_proto_strength_unknown=10$' /tmp/smoke.out || { echo "FAIL: ia_proto_strength_unknown != 10"; exit 1; }
          echo "OK: all Phase 0 pt1-pt4 invariants hold."
