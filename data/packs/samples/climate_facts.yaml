# R85 sample YAML records pack -- mirrors climate_facts.json one-to-one so
# operators can compare the JSON adapter's output against the YAML adapter's
# without hunting for schema differences. Ships as a single record with the
# same 10 atoms + 7 implications + 3 observations + 2 citations as the JSON
# sibling. Parses clean under yamlr_parse_text with kg_hint="" and
# source_tag="".
#
# Subset in use here:
#   * top-level list of records (single record)
#   * one-level nested mapping (`capsule:`)
#   * lists of mappings (`atoms:`, `implications:`, `observations:`,
#     `citations:`)
#   * bare-string scalars, quoted where a `:` appears in the value
#   * integer scalars for belief / sign / weight

- kg: climate
  source: "src:yaml:sample:climate:v1"
  capsule:
    name: climate_sample_yaml
    version: "1.0.0"
    description: "Small illustrative climate reference authored as YAML (R85 sample). Not comprehensive; do not treat as canonical."
    license: "CC-BY-4.0"
  atoms:
    - label: co2
      kind: concept
      belief: 950
    - label: greenhouse_gas
      kind: concept
      belief: 950
    - label: atmospheric_warming
      kind: fact
      belief: 900
    - label: fossil_fuel_combustion
      kind: concept
      belief: 900
    - label: sea_level_rise
      kind: fact
      belief: 850
    - label: ice_sheet_loss
      kind: fact
      belief: 850
    - label: ocean_acidification
      kind: fact
      belief: 800
    - label: methane
      kind: concept
      belief: 900
    - label: solar_forcing
      kind: concept
      belief: 700
    - label: carbon_sink
      kind: concept
      belief: 800
  implications:
    - ante: co2
      conseq: greenhouse_gas
      strength: FORMAL
    - ante: methane
      conseq: greenhouse_gas
      strength: FORMAL
    - ante: co2
      conseq: atmospheric_warming
      strength: EMPIRICAL
    - ante: fossil_fuel_combustion
      conseq: co2
      strength: EMPIRICAL
    - ante: atmospheric_warming
      conseq: ice_sheet_loss
      strength: EMPIRICAL
    - ante: ice_sheet_loss
      conseq: sea_level_rise
      strength: EMPIRICAL
    - ante: co2
      conseq: ocean_acidification
      strength: EMPIRICAL
  observations:
    - label: atmospheric_warming
      sign: 1
      weight: 750
    - label: sea_level_rise
      sign: 1
      weight: 700
    - label: solar_forcing
      sign: 1
      weight: 300
  citations:
    - from: "src:yaml:sample:climate:v1"
      to: "src:paper:doi:ipcc-ar6-wg1-2021"
      rel: supports
    - from: "src:yaml:sample:climate:v1"
      to: "src:paper:doi:noaa-annual-report-2023"
      rel: supports
