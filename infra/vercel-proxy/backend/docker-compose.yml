# Local development compose for the CrossEngin backend.
#
# `docker-compose up` exposes the wrapper on http://localhost:8080.
# Combine with `cd ../web && pnpm dev` in a second terminal to drive the
# full Vercel-hybrid flow locally.
#
# WARNING: the CROSSENGIN_TOKEN below is a development default that the
# entrypoint will REFUSE TO USE unless CE_ALLOW_DEV_TOKEN=1. This is
# deliberate: never expose this compose file directly to the public
# internet. For production, override CROSSENGIN_TOKEN AND the bind
# (set CE_BIND=127.0.0.1 behind a reverse proxy, or use Fly's internal
# network so only Vercel can reach you).
#
# See `README.md` next to this file for deployment recipes (Fly.io,
# Hetzner, Render).
services:
  crossengin-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override at build time:
        #   docker compose build --build-arg CROSSENGIN_REF=v0.1
        NOVA_REF: main
        CROSSENGIN_REF: main
    image: crossengin-backend:dev
    container_name: crossengin-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Dev token + the bypass flag so the entrypoint accepts it. Override
      # both for any non-localhost deployment.
      CROSSENGIN_TOKEN: "local-dev-token"
      CE_ALLOW_DEV_TOKEN: "1"
      # Defaults that match server.py / entrypoint.sh; surfacing them here
      # so operators see the knobs without grepping.
      CE_BIN: "bin/crossengin-chat"
      CE_PORT: "8080"
      CE_BIND: "0.0.0.0"
      CE_MAX_SESSIONS: "8"
      CE_REQUEST_TIMEOUT_S: "30.0"
    volumes:
      # Cognitive-state persistence (decision log, KG snapshots). Mount a
      # named volume in production; the bind-mount default makes local
      # inspection easy.
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
