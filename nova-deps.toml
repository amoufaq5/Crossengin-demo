# CrossEngin — NOVA toolchain and upstream-enhancement dependencies.
#
# CrossEngin is implemented in NOVA and depends on the NOVA compiler/runtime
# plus a set of upstream language/runtime enhancements. The enhancements are
# tracked as issues in the NOVA repository; CrossEngin's ADRs assume they land.
# Code that cannot be implemented against the *current* NOVA toolchain without
# a given enhancement is checked in as `<name>.nova.pending` (interface only)
# and listed in NEXT_SESSION.md.

[nova]
# The CrossEngin spec was written against an assumed "NOVA v4.1". The NOVA
# checkout this repo builds against reports v0.2.0 (src/version.nova) / v0.9.0
# (launcher). We pin to the actual self-hosting toolchain in the sibling repo.
# See NEXT_SESSION.md -> "Decisions needed from human: NOVA version".
version          = "0.2.0"
launcher_version = "0.9.0"
target           = "x86-64-linux"
source           = "https://github.com/amoufaq5/nova"

[build]
# Path to the NOVA launcher. Overridable: `make NOVA_ROOT=/path/to/NOVA build`.
nova_root_default = "${HOME}/NOVA"
launcher          = "${NOVA_ROOT}/nova"   # used for `nova build` / `nova run`

# NOVA core/runtime modules CrossEngin builds on conceptually (referenced by
# the ADRs and module headers). Cognitive core modules are not `std/`-importable
# and are integrated by composition; runtime modules are imported via `std/`.
[nova.modules]
core    = ["core/node.nova", "core/signal.nova", "core/channel.nova",
           "core/moment.nova", "core/knowledge.nova", "core/belief.nova",
           "core/goal.nova", "core/concept.nova", "core/imagination.nova",
           "core/soul.nova", "core/safety.nova", "core/similarity.nova",
           "core/system.nova", "core/path.nova"]
mind    = ["mind/academic.nova", "mind/experiential.nova", "mind/emotion.nova",
           "mind/memory.nova", "mind/reasoning.nova"]
agent   = ["agent/agent.nova", "agent/preprocess.nova"]
runtime = ["runtime/scheduler.nova", "runtime/coroutine.nova", "runtime/chan.nova",
           "runtime/io.nova", "runtime/alloc.nova", "runtime/persistent_alloc.nova",
           "runtime/simd.nova", "runtime/tensor.nova", "runtime/embedding.nova",
           "runtime/db.nova", "runtime/llm.nova"]

# ---------------------------------------------------------------------------
# Upstream NOVA enhancements CrossEngin depends on. id is stable and referenced
# across the ADRs ("DEPENDS ON: NOVA enhancement #N") and module headers.
# status: "available" | "partial" | "required"
# ---------------------------------------------------------------------------

[[enhancement]]
id = 1
title = "Pre-allocated fixed-capacity node arenas (1M+ nodes/part, target 1B)"
status = "partial"   # runtime/alloc.nova has an arena; fixed 1M-node pools at scale are not proven
extends = ["runtime/persistent_alloc.nova", "runtime/alloc.nova"]
blocks  = ["src/substrate/node_pool.nova (scale beyond a small in-memory pool)"]

[[enhancement]]
id = 2
title = "Sparse synapse adjacency (CSR-like) with O(1) weight update, growth, pruning"
status = "required"
extends = ["runtime/mem.nova"]
blocks  = ["src/substrate/synapse.nova (sparse 1M-node-scale adjacency)"]

[[enhancement]]
id = 3
title = "True concurrent execution units (fibers/processes) with typed channels"
status = "required"   # runtime/coroutine.nova is cooperative only
extends = ["runtime/coroutine.nova", "runtime/taskpool.nova", "runtime/chan.nova"]
blocks  = ["src/scheduler/scheduler.nova (genuine parallelism for the six loops)"]

[[enhancement]]
id = 4
title = "SIMD/GPU batched signal propagation across millions of synapses/tick"
status = "partial"   # runtime/simd.nova + tensor.nova exist; batched propagation kernel not built
extends = ["runtime/simd.nova", "runtime/tensor.nova", "runtime/gpu.nova", "runtime/blas.nova"]
blocks  = ["src/substrate/signal.nova (batched propagation at scale)"]

[[enhancement]]
id = 5
title = "100Hz deterministic tick scheduler fused with event-driven coordination"
status = "required"   # no wall-clock nanosleep/timer primitive verified in runtime
extends = ["runtime/scheduler.nova"]
blocks  = ["src/substrate/tick.nova (wall-clock pacing)", "src/scheduler/scheduler.nova"]

[[enhancement]]
id = 6
title = "Extended signal tag space (18+ types) with typed fast-dispatch"
status = "available" # implementable now as integer tag constants + dispatch
extends = ["core/signal.nova"]
blocks  = []

[[enhancement]]
id = 7
title = "Learned, content-based gate routing tables"
status = "required"
extends = ["core/channel.nova"]
blocks  = ["src/gates/ (learned routing)"]

[[enhancement]]
id = 8
title = "Multi-KG namespacing + cross-KG reference edges with similarity weights"
status = "partial"
extends = ["core/knowledge.nova", "core/similarity.nova"]
blocks  = ["src/kg/ (multi-KG spawn + cross-refs)"]

[[enhancement]]
id = 9
title = "Append-only, crash-safe (fsync) decision/audit log"
status = "partial"   # buffered file I/O works (runtime/io.nova); fsync durability not verified
extends = ["runtime/db.nova", "core/safety.nova", "runtime/io.nova"]
blocks  = ["src/audit/log.nova (crash-safe durability)"]

[[enhancement]]
id = 10
title = "Substrate snapshot + ordered rehydration (soul -> KGs -> episodic)"
status = "required"
extends = ["runtime/persistent_alloc.nova", "runtime/db.nova"]
blocks  = ["src/parts/ persistence", "ADR-0048"]

[[enhancement]]
id = 11
title = "Whitelisted, rate-limited outbound HTTP fetch with validation + cache"
status = "required"   # no TLS/socket stack verified in runtime
extends = ["runtime/io.nova", "runtime/syscall.nova"]
blocks  = ["src/learning/ (internet fetching, ADR-0028)"]

[[enhancement]]
id = 12
title = "Hebbian + error-driven plasticity kernels over synapse weight arrays"
status = "partial"   # scalar update implementable now; batched kernel needs SIMD work
extends = ["runtime/tensor.nova", "runtime/simd.nova"]
blocks  = ["src/substrate/synapse.nova (batched plasticity at scale)"]

[[enhancement]]
id = 13
title = "Idle-detection + background scheduling hooks (imagination/replay)"
status = "required"
extends = ["runtime/scheduler.nova"]
blocks  = ["src/parts/imagination/ (idle loop, ADR-0036)"]

[[enhancement]]
id = 14
title = "STT/TTS modality bridge isolation guaranteeing no cognition path"
status = "partial"   # runtime/llm.nova exists; isolation guarantee must be hardened + asserted
extends = ["runtime/llm.nova"]
blocks  = ["src/io/transducers/ (modality only, ADR-0014)"]
