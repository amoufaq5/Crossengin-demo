# CrossEngin capability policy sample.
# Place at ~/.crossengin/caps.conf (or point CE_CAPS_CONF to any path).
# One directive per line: <cap_name> = allow | deny
# Blank lines and lines beginning with # are ignored.
#
# Shipped defaults (if a cap is not listed here, these apply):
#   read_kb           = allow             (read-only)
#   answer            = allow             (read-only egress of belief)
#   ingest_atom       = allow             (new CANDIDATE atoms)
#   autonomous_fetch  = require_approval  (/learn <URL>)
#   network_send      = require_approval  (/fed_join, outbound sockets)
#   delete            = require_approval  (/retract, /load, self-update)
#   self_update       = require_approval
#   edit_governance   = require_approval
#   promote_atom      = require_approval
#
# Session-level `allow` means "no prompt". `deny` means "refused outright".
# To return a cap to its default (require_approval), run `/cap default <name>`.
# To inspect current effective policy, run `/cap list`.
# To view the attestation log of each gated call, run `/__safety__`.

# Example: pre-authorise fetches in a trusted trading loop.
# autonomous_fetch = allow

# Example: hard-ban federation joins in child mode.
# network_send = deny
